name: jamboo
description: "Jamboo Food Delivery App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.0.2
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  firebase_storage: ^13.0.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21