workflows:
  jamboo_customer_ios:
    name: Jamboo Customer App - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS without code signing
        script: flutter build ios --release --no-codesign -t lib/main.dart

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  jamboo_customer_simulator:
    name: Jamboo Customer App - iOS Simulator Test
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS Simulator App
        script: flutter build ios --debug --simulator -t lib/main.dart

    artifacts:
      - build/ios/iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log